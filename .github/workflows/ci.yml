name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Set isolated development home
        run: |
          echo "DEVPANEL_HOME=$(mktemp -d /tmp/dp-ci.XXXXXX)" >> "$GITHUB_ENV"
          echo "DEVPANEL_PORT=0" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: TypeScript and web tests
        run: pnpm test
      - name: Build workspace
        run: pnpm build
      - name: Swift tests
        run: swift test --package-path apps/mac
      - name: Build native release executable
        run: swift build -c release --package-path apps/mac
